<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} · Replay scheduler</title>
  {% block head %}{% endblock %}
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --border: #dcdcd6;
      --accent: #2457c5; --accent-text: #ffffff;
      --ok-bg: #e6f2e8; --ok: #1f6b33; --warn-bg: #fdf3dc; --warn: #7a5300; --err-bg: #fbe7e5; --err: #9b2318;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161615; --panel: #1f1f1d; --text: #e9e9e4; --muted: #9c9c95; --border: #393936;
        --accent: #7aa2f7; --accent-text: #10131a;
        --ok-bg: #18301e; --ok: #8fd19e; --warn-bg: #352a10; --warn: #f0c870; --err-bg: #3a1a17; --err: #f29b91;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    header.top { border-bottom: 1px solid var(--border); background: var(--panel); }
    header.top div, main { max-width: 1100px; margin: 0 auto; padding: 12px 16px; }
    header.top div { display: flex; gap: 16px; align-items: center; }
    header.top a { color: var(--text); text-decoration: none; font-weight: 600; }
    header.top .spacer { flex: 1; }
    a { color: var(--accent); }
    h1 { font-size: 1.5rem; margin: 8px 0 16px; }
    h2 { font-size: 1.1rem; margin: 28px 0 8px; }
    .muted { color: var(--muted); }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    .banner { border-radius: 6px; padding: 10px 14px; margin-bottom: 12px; }
    .banner.ok { background: var(--ok-bg); color: var(--ok); }
    .banner.warn { background: var(--warn-bg); color: var(--warn); }
    .banner.err { background: var(--err-bg); color: var(--err); white-space: pre-wrap; }
    table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
    tr:last-child td { border-bottom: none; }
    .table-wrap { overflow-x: auto; }
    .status { display: inline-block; font-size: 0.75rem; font-weight: 600; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--border); text-transform: uppercase; letter-spacing: 0.04em; }
    .status.approved, .status.collating { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
    .status.failed { background: var(--err-bg); color: var(--err); border-color: transparent; }
    .status.proposed { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
    button, .button { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border); background: var(--panel); color: var(--text); cursor: pointer; text-decoration: none; display: inline-block; }
    button.primary, .button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
    form.inline { display: inline; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    label { display: block; font-weight: 600; margin: 12px 0 4px; }
    label .hint { font-weight: 400; color: var(--muted); }
    input[type=text], input[type=datetime-local], textarea { width: 100%; font: inherit; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); }
    textarea { min-height: 70px; font-family: ui-monospace, monospace; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
    @media (max-width: 640px) { .row { grid-template-columns: 1fr; } }
    fieldset { border: none; padding: 0; margin: 0; }
    dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 0; }
    dt { color: var(--muted); }
    dd { margin: 0; overflow-wrap: anywhere; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 0.85rem; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 10px; max-height: 420px; overflow: auto; }
    details summary { cursor: pointer; }
    .banner.progress { background: var(--ok-bg); color: var(--ok); display: flex; align-items: center; gap: 10px; }
    .spinner { width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; flex: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .event-banner { display: block; margin-top: 8px; }
    .event-banner img { display: block; max-width: 100%; height: auto; border-radius: 6px; border: 1px solid var(--border); }
    .event-banner + h3 { margin-top: 16px; }
    h3 { font-size: 0.95rem; margin: 0; }
    .layout { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 16px; }
    @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header class="top"><div>
    <a href="/">Replay scheduler</a>
    <span class="spacer"></span>
    <a class="button" href="/events/new">Add event</a>
  </div></header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
